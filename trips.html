<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>旅行管理 | QRチェック</title>
  <link rel="stylesheet" href="./photography.css?v=20260913-7" />
  <link rel="stylesheet" href="./auth-gate.css?v=20260913-2" />
  <style>
    .trip-manager-shell{max-width:980px;margin:0 auto;padding:20px 16px 80px}.trip-manager-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.trip-manager-badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:900;margin-bottom:6px}.trip-manager-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:10px;align-items:end}.trip-manager-field{display:grid;gap:5px;min-width:0}.trip-manager-field label{font-size:12px;font-weight:800;color:#475569}.trip-manager-field input{width:100%;min-width:0;box-sizing:border-box;min-height:42px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;background:#fff;color:#0f172a}.trip-manager-list{display:grid;gap:10px}.trip-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}.trip-main{display:grid;gap:4px;min-width:0}.trip-main strong,.trip-main code,.trip-main span{overflow-wrap:anywhere}.trip-main code{font-size:12px;color:#475569}.trip-meta{font-size:12px;color:#64748b}.trip-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.trip-status{display:inline-block;width:max-content;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900}.trip-status-active{background:#dcfce7;color:#166534}.trip-status-ended{background:#e2e8f0;color:#475569}.manager-status{margin:10px 0 0;font-size:13px;font-weight:700;color:#475569}.manager-status-error{color:#b91c1c}.trip-login{max-width:460px;margin:80px auto;padding:0 16px}.trip-login .card{display:grid;gap:12px}.trip-login .btn{width:100%}@media(max-width:760px){.trip-manager-form,.trip-row{grid-template-columns:1fr}.trip-manager-form .btn{width:100%}.trip-controls{display:grid;grid-template-columns:1fr 1fr}.trip-controls .btn{width:100%}.trip-manager-head{align-items:center}}
  </style>
  <script type="module" src="./trip-manager.js?v=20260915-1"></script>
</head>
<body>
  <main id="tripManagerApp" class="trip-manager-shell" hidden>
    <header class="trip-manager-head">
      <div>
        <span class="trip-manager-badge">サービス管理者</span>
        <p class="eyebrow">QRチェック 管理</p>
        <h1>旅行管理</h1>
      </div>
      <button id="tripManagerLogout" class="btn btn-secondary" type="button">ログアウト</button>
    </header>

    <section class="card">
      <h2>新しい旅行を作成</h2>
      <p class="muted">旅行コードはURLや参加時に使う固定IDです。作成後は変更できません。</p>
      <form id="tripCreateForm" class="trip-manager-form">
        <div class="trip-manager-field"><label for="tripCodeInput">旅行コード</label><input id="tripCodeInput" name="tripId" autocomplete="off" placeholder="例: 2026-autumn-trip" /></div>
        <div class="trip-manager-field"><label for="tripNameInput">旅行名</label><input id="tripNameInput" name="name" autocomplete="off" placeholder="例: ○○小学校 修学旅行" /></div>
        <button class="btn btn-primary" type="submit">作成</button>
      </form>
      <p id="tripManagerStatus" class="manager-status">管理情報を読み込んでいます…</p>
    </section>

    <section class="card">
      <div class="section-head"><div><h2>旅行一覧</h2><p class="muted">終了済み旅行もここから再開できます。</p></div><strong id="tripCount">0件</strong></div>
      <div id="tripList" class="trip-manager-list"><p class="muted">読み込み中…</p></div>
    </section>
  </main>

  <main id="tripManagerLogin" class="trip-login">
    <section class="card">
      <h1>旅行管理</h1>
      <p class="muted">QRサービス管理者のみ利用できます。</p>
      <button id="tripManagerLoginBtn" class="btn btn-primary" type="button">Googleでログイン</button>
      <p id="tripManagerLoginStatus" class="manager-status"></p>
    </section>
  </main>
</body>
</html>
