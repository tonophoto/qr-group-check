<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>撮影チェック エフェクト確認</title>
  <link rel="stylesheet" href="./photography.css?v=20260913-7" />
  <link rel="stylesheet" href="./photography-effects.css?v=20260913-2" />
  <style>
    .effect-candidate-list{display:grid;gap:10px}.effect-candidate-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}.effect-candidate-info{display:grid;gap:3px}.effect-candidate-row .btn{min-width:92px}@media(max-width:520px){.effect-candidate-row{grid-template-columns:1fr}.effect-candidate-row .btn{width:100%}}
  </style>
  <script src="./photography-effects.js?v=20260913-2" defer></script>
  <script src="./effect-check.js?v=20260913-2" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">カメラマン用</p>
        <h1>画面エフェクトをためす</h1>
      </div>
      <a class="nav-link" href="./photography.html">撮影チェックへ</a>
    </header>

    <section class="card">
      <h2>1回目：START</h2>
      <p class="muted">その班と最初に出会った時だけ、既存の撮影チェック成功画面にSTART演出を重ねます。</p>
      <button id="previewStartBtn" class="btn btn-primary btn-wide" type="button">▶ 1回目の演出を確認</button>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <h2>2回目以降の候補</h2>
          <p class="muted">音と同じように、1個ずつ試して採用する演出を選びます。</p>
        </div>
      </div>
      <div id="effectCandidateList" class="effect-candidate-list"></div>
    </section>

    <section class="card notice-card">
      <strong>候補</strong>
      <p>スター爆発 / レインボーリング / 紙吹雪ポップ / パワーフラッシュ。ここでは確認だけで、撮影チェック本体の2回目以降にはまだ反映していません。</p>
    </section>
  </main>

  <div id="resultOverlay" class="overlay" aria-hidden="true">
    <div id="resultPanel" class="result-panel success" role="status" aria-live="assertive">
      <div class="result-icon">✓</div>
      <div id="resultLabel" class="result-label">A-1</div>
      <div id="resultMessage" class="result-message">撮影チェック 1回目</div>
      <div id="resultMeta" class="result-meta">田中・10:24</div>
    </div>
  </div>
</body>
</html>
